---
# ============================================================
#  cPanel Git Deployment - JADISATU (jadisatukreatif.com)
# ============================================================
deployment:
  tasks:
    - export APPDIR=/home/jadj3934/repositories/meraki-jadisatucompro
    - export PUBDIR=/home/jadj3934/public_html
    - export PHP="php"

    # 1. Salin aset dan file publik ke public_html
    - /bin/cp -R $APPDIR/public/. $PUBDIR/
    - /bin/rm -f $PUBDIR/index.html $PUBDIR/default.html

    # 2. Arahkan index.php di public_html ke folder repo Laravel
    - /bin/sed -i "s|__DIR__\.'/\.\./|__DIR__.'/../repositories/meraki-jadisatucompro/|g" $PUBDIR/index.php

    # 3. Buat folder storage fisik di public_html (bukan symlink agar tidak diblokir Apache)
    - /bin/rm -rf $PUBDIR/storage
    - /bin/mkdir -p $PUBDIR/storage
    - /bin/cp -R $APPDIR/storage/app/public/. $PUBDIR/storage/ 2>/dev/null || true
    - /bin/chmod -R 775 $APPDIR/storage $PUBDIR/storage $APPDIR/bootstrap/cache

    # 4. Bersihkan cache
    - cd $APPDIR && $PHP artisan optimize:clear
